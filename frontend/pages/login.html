<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Portal Ciência</title>
    <link rel="stylesheet" href="/frontend/css/login.css">
</head>

<body>
<div class="container">
    <div class="card">
        <h1>Login</h1>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Senha"
            required
        >

        <button id="btnEntrar">Entrar</button>

        <p>Não tem conta?
            <a href="/frontend/pages/cadastro.html">Cadastre-se</a>
        </p>
    </div>
</div>

<script src="/frontend/js/login.js"></script>

</body>
</html>
