<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artigo - Portal Ciência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/frontend/css/styles.css">

<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
</style>

<style>
.artigo-completo{
    max-width: 1000px;
    margin: 50px auto;
    padding: 20px;
}

.artigo-completo img{
    width: 100%;
    border-radius: 12px;
    margin: 20px 0;
}

.artigo-completo h1{
    margin-top: 3.5rem;
    margin-bottom: 2rem;
}

.artigo-completo p{
    line-height: 1.8;
    margin-bottom: 20px;
    text-align: justify;
    font-size: 1.3rem;
}

.artigo-meta{
    color: #666;
    font-size: 1rem;
    margin-bottom: 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.btn-voltar{
    display: inline-block;
    padding: 10px 20px;
    background: #00d4ff;
    color: #000;
    text-decoration: none;
    border-radius: 8px;
    margin-top: 20px;
}

/* ===== COMENTÁRIOS ===== */
.comentarios {
    max-width: 1000px;
    margin: 30px auto 50px;
    padding: 20px;
}

.comentarios h2 {
    font-family: 'Playfair Display', serif;
    border-bottom: 2px solid #00d4ff;
    padding-bottom: 10px;
    margin-bottom: 20px;
}

.lista-comentarios {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 25px;
}

.comentario {
    background: #f5f7fa;
    border-radius: 10px;
    padding: 15px;
    border-left: 4px solid #00d4ff;
}

.comentario-autor {
    font-weight: bold;
    color: #0c0c2e;
    margin-bottom: 5px;
}

.comentario-texto {
    color: #333;
    margin-bottom: 8px;
}

.comentario-data {
    color: #888;
    font-size: 0.85rem;
}

.sem-comentarios {
    color: #888;
    font-style: italic;
}

.form-comentario textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
    resize: vertical;
    min-height: 90px;
    box-sizing: border-box;
    font-family: inherit;
}

.form-comentario textarea:focus {
    outline: none;
    border-color: #00d4ff;
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
}

.btn-comentar {
    margin-top: 10px;
    padding: 12px 25px;
    background: linear-gradient(135deg, #00d4ff, #0099cc);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn-comentar:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 212, 255, 0.5);
}

.aviso-login {
    background: #f5f7fa;
    border-radius: 8px;
    padding: 15px;
    text-align: center;
    color: #333;
}

.aviso-login a {
    color: #00d4ff;
    font-weight: bold;
    text-decoration: none;
}

.carregando {
    text-align: center;
    padding: 40px;
    font-size: 1.2rem;
    color: #666;
}
</style>

</head>
<body>

<header>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2>🚀 Portal Ciência</h2>
            </div>

            <ul class="nav-menu">
                <li><a href="/frontend/pages/index.html" class="nav-link">Home</a></li>
                <li><a href="/frontend/pages/experimentos.html" class="nav-link">Experimentos</a></li>
                <li><a href="/frontend/pages/artigos/artigos.html" class="nav-link">Artigos</a></li>
                <li id="menuLogin"><a href="/frontend/pages/login.html" class="nav-link">Login</a></li>
                <li id="menuCadastro"><a href="/frontend/pages/cadastro.html" class="nav-link">Cadastro</a></li>
            </ul>

            <!-- Perfil do Usuário -->
            <div id="perfilUsuario" class="perfil-usuario" style="display:none;">
                <div class="perfil-menu">
                    <div class="avatar" id="avatarUsuario">👤</div>
                    <span id="nomeUsuario"></span>
                    <span class="seta">▼</span>
                    <div class="dropdown">
                        <a href="/frontend/pages/perfil.html">👤 Meu Perfil</a>
                        <a href="/frontend/pages/editar-perfil.html">✏️ Editar Perfil</a>
                        <a href="/frontend/pages/alterar-senha.html">🔒 Alterar Senha</a>
                        <a href="/frontend/pages/artigos/meus-artigos.html">📄 Meus Artigos</a>
                        <a href="/frontend/pages/minhas-publicacoes.html">🎬 Minhas Publicações</a>
                        <hr>
                        <a href="#" id="btnLogout">🚪 Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>

<div class="artigo-completo" id="artigoConteudo">
    <p class="carregando">Carregando artigo...</p>
</div>

<a href="/frontend/pages/artigos/artigos.html" class="btn-voltar" style="display:block; max-width: 200px; margin: 0 auto; text-align:center;">← Voltar aos Artigos</a>

<!-- ===== SEÇÃO DE COMENTÁRIOS ===== -->
<section class="comentarios" id="secaoComentarios" style="display:none;">

    <h2>💬 Comentários</h2>

    <div class="lista-comentarios" id="listaComentarios">
        <p class="sem-comentarios">Carregando comentários...</p>
    </div>

    <div class="form-comentario" id="formComentario">
        <!-- Preenchido pelo JS: formulário ou aviso de login -->
    </div>

</section>

<script src="/frontend/js/artigo-dinamico.js"></script>
<script src="/frontend/js/menu.js"></script>

</body>
</html>
